version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-prtg-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        limits:
          memory: 8G
    networks:
      - ai-prtg-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ai-prtg-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./core:/app/core
      - ./data:/app/data
      - ./scripts:/app/scripts
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - ai-prtg-network

volumes:
  ollama_data:

networks:
  ai-prtg-network:
    driver: bridge